
name: TestCafe CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Run TestCafe Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install TestCafe from npm and Run Tests
      uses: DevExpress/testcafe-action@latest
      with:
        args: "chrome test/FirstTest.js"
